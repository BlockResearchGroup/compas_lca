name: docs

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  docs:
    runs-on: windows-latest
    steps:
      - uses: compas-dev/compas-actions.docs@v4
        with:
          python: '3.11'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          doc_url: https://BlockResearchGroup.github.io/compas_lca
