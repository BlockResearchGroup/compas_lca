# ======= PROJECT SETTINGS =======
project_folder: "projects/duplex"

# ======= MATCHING SETTINGS =======
score_threshold: 0.5
top_k_matches: 10
include_explain: false

# ======= LCA / REPORT SETTINGS =======
impact_report:
  indicators:
    - GWPtotal
    - PENRT
    - WDP
  net_stages:
    - A1-A3
    - A4
    - A5
    - C1
    - C2
    - C3
    - C4
    - D

# ======= ENRICHMENT SETTINGS =======
